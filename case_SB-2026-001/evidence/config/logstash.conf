input {
  file {
    path => "/logs/securebank.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

filter {
  grok {
    match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} - %{WORD:loglevel} - %{GREEDYDATA:log_message}" }
  }
  
  # Parse specific log patterns
  grok {
    match => { "log_message" => "LOGIN_ATTEMPT username=%{USERNAME:username} ip=%{IP:client_ip}" }
  }
  
  grok {
    match => { "log_message" => "LOGIN_SUCCESS username=%{USERNAME:username}" }
  }
  
  grok {
    match => { "log_message" => "LOGIN_FAILED username=%{USERNAME:username}" }
  }
  
  grok {
    match => { "log_message" => "ACCOUNT_VIEW user=%{USERNAME:user} account_id=%{NUMBER:account_id}" }
  }
  
  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "securebank-logs-%{+YYYY.MM.dd}"
  }
  
  stdout {
    codec => rubydebug
  }
}
